services:
  sniffer:
    build: .
    network_mode: "host"
    command: ["${IFACE}"]
    environment:
      - DOCKER_INFLUXDB_INIT_ORG=${ENV_INFLUX_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${ENV_INFLUX_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${ENV_INFLUX_ADMIN_TOKEN}
    cap_add:
      - NET_RAW
      - NET_ADMIN
    restart: always

  influxdb:
    image: influxdb:2.7
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=${ENV_INFLUX_MODE}
      - DOCKER_INFLUXDB_INIT_USERNAME=${ENV_INFLUX_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${ENV_INFLUX_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${ENV_INFLUX_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${ENV_INFLUX_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${ENV_INFLUX_ADMIN_TOKEN}
    volumes:
      - influx-data:/var/lib/influxdb2
    restart: always

  grafana:
    image: grafana/grafana-oss
    ports:
      - "3000:3000"
    depends_on:
      - influxdb
    restart: always

volumes:
  influx-data:
